[project]
name = "email-attack-chain-prompt-injection"
version = "0.1.0"
description = "Reproducible experiments for email-agent prompt-injection detection through attack-chain modeling."
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.0.0",
  "huggingface-hub>=0.25.0",
  "joblib>=1.4.0",
  "matplotlib>=3.9.0",
  "numpy>=2.0.0",
  "openai>=1.50.0",
  "pandas>=2.2.0",
  "pyarrow>=17.0.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.14.0",
  "seaborn>=0.13.0",
  "sentence-transformers>=3.0.0",
  "torch>=2.0.0",
  "transformers>=4.44.0",
  "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["src"]
